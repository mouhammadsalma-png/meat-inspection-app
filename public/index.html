<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الهيئة اللبنانية لسلامة الغذاء</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    body { font-family: 'Cairo', sans-serif; }
    #status-bar { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 8px; font-weight: bold; font-size: 14px; z-index: 9999; transition: 0.3s; }
    .online { background: #16a34a; color: white; transform: translateY(100%); }
    .offline { background: #dc2626; color: white; transform: translateY(0); }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- شريط حالة الاتصال -->
  <div id="status-bar" class="online">متصل بالإنترنت</div>

  <!-- تسجيل الدخول -->
  <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-200">
      <div class="text-center mb-6 flex flex-col items-center">
        <img src="logo.png" alt="شعار الهيئة" class="w-32 h-32 object-contain mb-4" onerror="this.style.display='none'">
        <h1 class="text-2xl font-bold text-red-700">الهيئة اللبنانية لسلامة الغذاء</h1>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg" placeholder="اسم المستخدم">
        <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg" placeholder="كلمة المرور">
        <button type="submit" id="login-btn" class="w-full bg-red-700 text-white py-2 rounded-lg font-bold hover:bg-red-800 transition">تسجيل الدخول</button>
      </form>
    </div>
  </div>

  <!-- اختيار نوع المؤسسة -->
  <div id="facility-selection-section" class="hidden min-h-screen p-4 max-w-6xl mx-auto">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-200">
      <div class="flex justify-between items-start mb-6 border-b pb-4">
        <div class="flex items-center gap-4">
          <img src="logo.png" class="w-16 h-16 object-contain" onerror="this.style.display='none'">
          <div><h2 class="text-2xl font-bold text-red-700">اختر نوع المؤسسة الغذائية</h2></div>
        </div>
        <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded-lg">خروج</button>
      </div>
      <div id="facility-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>
  </div>

  <!-- لوحة المراقب -->
  <div id="inspector-section" class="hidden min-h-screen p-4 max-w-4xl mx-auto mb-10">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-200">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <div class="flex items-center gap-3">
          <img src="logo.png" class="w-12 h-12 object-contain" onerror="this.style.display='none'">
          <h2 class="text-xl font-bold text-red-700">استمارة الكشف</h2>
        </div>
        <div class="flex gap-2">
          <button onclick="changeFacility()" class="text-sm bg-yellow-100 text-yellow-800 px-3 py-1 rounded-lg">تغيير المؤسسة</button>
          <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded-lg">خروج</button>
        </div>
      </div>

      <form id="inspection-form" onsubmit="submitInspection(event)" class="space-y-6">
        <div class="bg-gray-50 p-4 rounded-xl space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">نوع المؤسسة</label>
              <div id="facility_type_display" class="w-full px-4 py-2 border rounded-lg bg-red-50 font-bold"></div>
              <input type="hidden" id="facility_type"><input type="hidden" id="facility_key">
            </div>
            <div><label class="block text-sm font-semibold mb-1">اسم المؤسسة</label><input type="text" id="shop_name" required class="w-full px-4 py-2 border rounded-lg"></div>
            <div><label class="block text-sm font-semibold mb-1">المراقب</label><input type="text" id="inspector_name" required class="w-full px-4 py-2 border rounded-lg"></div>
            <div><label class="block text-sm font-semibold mb-1">التاريخ</label><input type="date" id="inspect_date" required class="w-full px-4 py-2 border rounded-lg"></div>
          </div>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div><label class="block text-sm font-semibold mb-1">الحرارة</label><input type="text" id="temp_info" class="w-full px-4 py-2 border rounded-lg"></div>
            <div><label class="block text-sm font-semibold mb-1">المطابقة (م)</label><input type="number" id="count_m" value="0" readonly class="w-full px-4 py-2 border rounded-lg bg-green-50"></div>
            <div><label class="block text-sm font-semibold mb-1">عدم المطابقة (غير م)</label><input type="number" id="count_g" value="0" readonly class="w-full px-4 py-2 border rounded-lg bg-red-50"></div>
          </div>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl">
          <h3 class="font-bold text-red-700 border-b pb-2 mb-4">3. قائمة التحقق التفصيلية</h3>
          <div id="checklist-container" class="space-y-4"></div>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl space-y-4">
          <h3 class="font-bold text-red-700 border-b pb-2">4. التقييم النهائي</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">النتيجة النهائية</label>
              <select id="result" class="w-full px-4 py-2 border rounded-lg">
                <option value="مستوفي الشروط الصحية">مستوفي الشروط الصحية</option>
                <option value="غير مستوفي الشروط">غير مستوفي الشروط</option>
                <option value="إنذار وإتلاف فوري">إنذار وإتلاف فوري</option>
                <option value="إغلاق إداري مؤقت">إغلاق إداري مؤقت</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">الخطورة</label>
              <select id="risk" class="w-full px-4 py-2 border rounded-lg">
                <option value="منخفض (Low Risk)">منخفض</option>
                <option value="متوسط (Medium Risk)">متوسط</option>
                <option value="عالي / خطر داهم (Critical Hazard)">عالي</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 🔥 الملاحظات العامة مع زر الميكروفون -->
        <div class="bg-gray-50 p-4 rounded-xl space-y-4">
          <h3 class="font-bold text-red-700 border-b pb-2">5. ملاحظات عامة وتوصيات</h3>
          <div class="flex gap-2 items-start">
            <textarea id="general_notes" rows="4" class="w-full px-4 py-2 border rounded-lg bg-white" placeholder="أدخل أي ملاحظات إضافية هنا... أو اضغط على الميكروفون للتحدث"></textarea>
            <button type="button" id="general-mic-btn" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-3 text-xl rounded-lg border border-red-300 transition shadow-sm shrink-0" title="تسجيل صوتي">🎤</button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-green-700 transition">حفظ الكشف</button>
      </form>
    </div>
  </div>

  <!-- لوحة المدير -->
  <div id="admin-section" class="hidden min-h-screen p-4 max-w-7xl mx-auto">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-200">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <div class="flex items-center gap-3">
          <img src="logo.png" class="w-12 h-12 object-contain">
          <h2 class="text-xl font-bold text-red-700">لوحة تحكم المدير</h2>
        </div>
        <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded-lg">خروج</button>
      </div>
      
      <div id="pending-sync-alert" class="hidden bg-yellow-100 border-r-4 border-yellow-500 text-yellow-700 p-4 mb-4 rounded">
        لديك <span id="pending-count" class="font-bold">0</span> كشوفات محفوظة محلياً بانتظار المزامنة.
        <button onclick="syncOutbox()" class="mr-4 bg-yellow-500 text-white px-3 py-1 rounded text-sm">مزامنة الآن</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-right border-collapse">
          <thead><tr class="bg-red-700 text-white text-sm">
            <th class="p-3">الرقم</th><th class="p-3">المحل</th><th class="p-3">المراقب</th><th class="p-3">النتيجة</th><th class="p-3">إجراءات</th>
          </tr></thead>
          <tbody id="inspections-table-body" class="text-sm divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- نافذة التعديل -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 overflow-y-auto p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-4xl mx-auto my-4 p-4">
        <h2 class="text-xl font-bold text-red-700 mb-4">تعديل كشف</h2>
        <button onclick="saveEditedInspection()" class="w-full bg-green-600 text-white py-2 rounded">حفظ التعديلات</button>
        <button onclick="closeEditModal()" class="w-full bg-gray-200 text-gray-700 py-2 rounded mt-2">إلغاء</button>
    </div>
  </div>

  <script>
    // --- 1. PWA & Connection ---
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
    function updateOnlineStatus() {
      const bar = document.getElementById('status-bar');
      if (navigator.onLine) { bar.className = 'online'; bar.textContent = 'متصل بالإنترنت'; syncOutbox(); } 
      else { bar.className = 'offline'; bar.textContent = 'غير متصل - سيتم الحفظ محلياً'; }
    }
    window.addEventListener('online', updateOnlineStatus); window.addEventListener('offline', updateOnlineStatus); updateOnlineStatus();

    // --- 2. IndexedDB (Offline Storage) ---
    let db;
    const request = indexedDB.open("LFSADatabase", 1);
    request.onupgradeneeded = (e) => { db = e.target.result; if (!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox', { keyPath: 'localId', autoIncrement: true }); };
    request.onsuccess = (e) => { db = e.target.result; checkPendingSync(); };

    function saveToLocalDB(payload) {
      const tx = db.transaction('outbox', 'readwrite');
      tx.objectStore('outbox').add(payload);
      tx.oncomplete = () => {
        if (confirm('📴 أنت غير متصل. تم حفظ الكشف في الهاتف.\n\nهل ترغب في طباعة/حفظ نسخة PDF للمؤسسة الآن؟')) {
          payload.id = 'OFFLINE'; downloadPDF(payload);
        }
        checkPendingSync(); changeFacility();
      };
    }

    function checkPendingSync() {
      if (!db) return;
      const tx = db.transaction('outbox', 'readonly'); const countReq = tx.objectStore('outbox').count();
      countReq.onsuccess = () => {
        if (countReq.result > 0) { document.getElementById('pending-sync-alert').classList.remove('hidden'); document.getElementById('pending-count').textContent = countReq.result; } 
        else { document.getElementById('pending-sync-alert').classList.add('hidden'); }
      };
    }

    async function syncOutbox() {
      if (!navigator.onLine || !db) return;
      const tx = db.transaction('outbox', 'readonly'); const getAllReq = tx.objectStore('outbox').getAll();
      getAllReq.onsuccess = async () => {
        const items = getAllReq.result;
        for (let item of items) {
          try {
            const res = await fetch('/api/inspections', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) });
            if (res.ok) { const delTx = db.transaction('outbox', 'readwrite'); delTx.objectStore('outbox').delete(item.localId); delTx.oncomplete = () => checkPendingSync(); }
          } catch (err) { break; }
        }
        if (!document.getElementById('admin-section').classList.contains('hidden')) loadInspections();
      };
    }
    setInterval(syncOutbox, 30000);

            items: ['حرارة التخزين مناسبة','حرارة الطهي موثقة','تبريد سريع للحلويات الحساسة'] },
          { name: 'منع التلوث التبادلي', ref: 'HACCP',
            items: ['فصل مناطق العجين عن الحشوات','فصل الحلويات بالكريمة عن الجافة','أدوات مخصصة'] },
          { name: 'مكافحة الحشرات', ref: 'IPM',
            items: ['عقد ساري','مصائد تعمل','غياب آثار حشرات/قوارض'] },
          { name: 'التتبع والتوثيق', ref: 'ISO 22000',
            items: ['خطة HACCP موثقة','سجلات تدريب','إجراء استدعاء موثق'] }
        ]
      },
      factory: {
        label: 'مصنع أغذية', icon: '🏭', description: 'تصنيع وتعبئة',
        categories: [
          { name: 'تصميم المنشأة', ref: 'Codex §4',
            items: ['فصل المناطق النظيفة عن غير النظيفة','مسار خطي للإنتاج (Linear Flow)','مواد بناء قابلة للتنظيف','صرف صحي مطابق'] },
          { name: 'الصحة الشخصية', ref: 'Codex §7',
            items: ['شهادات صحية','زي وأغطية رأس وأحذية','مغاسل أيدي مع مطهر','برنامج صحي للعاملين'] },
          { name: 'التحكم بالحرارة', ref: 'HACCP',
            items: ['CCPs محددة ومُراقبة','سجلات حرارة موثقة','تحقق (Verification) دوري'] },
          { name: 'النظافة والتعقيم', ref: 'GFSI',
            items: ['SSOP موثق','تعقيم خطوط الإنتاج','نظافة البيئة (Environmental Monitoring)'] },
          { name: 'منع التلوث التبادلي', ref: 'HACCP',
            items: ['فصل الأغذية النيئة عن المطبوخة','فصل المواد المسببة للحساسية','أدوات مخصصة'] },
          { name: 'التعبئة والتغليف', ref: 'Codex §5',
            items: ['مواد تغليف غذائية معتمدة','وسم صحيح (Batch/Lot/Date)','تخزين التغليف بشكل نظيف'] },
          { name: 'التتبع والاستدعاء', ref: 'ISO 22000',
            items: ['تتبع كل دفعة من الخام للمنتج','إجراء استدعاء موثق ومُختبر دورياً','خطة HACCP موثقة ومحدثة'] }
        ]
      },
      cafe: {
        label: 'كافيه', icon: '☕', description: 'مشروبات ووجبات خفيفة',
        categories: [
          { name: 'الصحة الشخصية', ref: 'Codex §7',
            items: ['شهادات صحية','نظافة الأيدي والزي','مغاسل أيدي مع مطهر'] },
          { name: 'النظافة', ref: 'GFSI',
            items: ['نظافة آلات القهوة والمعدات','نظافة الأكواب والأدوات','نظافة الأسطح والطاولات'] },
          { name: 'التحكم بالحرارة', ref: 'HACCP',
            items: ['ثلاجات 0-4°م','حرارة الماء ≥ 90°م للتحضير','سجلات حرارة'] },
          { name: 'المياه والثلج', ref: 'WHO',
            items: ['مياه صالحة للشرب','ثلج من مياه صالحة','تنظيف آلات الثلج دورياً'] },
          { name: 'التخزين', ref: 'Codex §5',
            items: ['تخزين المواد الجافة بشكل صحي','تخزين الحلويات في مكان مخصص'] },
          { name: 'مكافحة الحشرات', ref: 'IPM',
            items: ['عقد ساري','غياب آثار حشرات/قوارض'] }
        ]
      },
      warehouse: {
        label: 'مستودع أغذية', icon: '📦', description: 'تخزين وتوزيع',
        categories: [
          { name: 'تخزين الأغذية', ref: 'Codex §5',
            items: ['رفوف مرتفعة عن الأرض','فصل الأغذية عن غير الغذائية','تدوير FIFO/FEFO','فحص تواريخ الصلاحية'] },
          { name: 'التحكم بالحرارة', ref: 'HACCP',
            items: ['غرف تبريد 0-4°م','غرف تجميد ≤ -18°م','سجلات حرارة دورية'] },
          { name: 'النظافة', ref: 'GFSI',
            items: ['نظافة الأرضيات والرفوف','برنامج تنظيف موثق'] },
          { name: 'مكافحة الحشرات', ref: 'IPM',
            items: ['عقد مكافحة ساري','مصائد على الأبواب','شبك على الفتحات'] },
          { name: 'التتبع', ref: 'ISO 22000',
            items: ['سجلات تتبع الموردين والعملاء','إجراء استدعاء موثق'] }
        ]
      }
    };

    let currentFacilityKey = null, currentChecklistState = {}, windowInspections = [], editingInspection = null, editingFacilityKey = null, editingChecklistState = {};
    function getCache() { return JSON.parse(localStorage.getItem('lfsa_cache') || '{}'); }

    // --- 4. Core Functions ---
    async function handleLogin(e) {
      e.preventDefault(); const btn = document.getElementById('login-btn'); btn.disabled = true;
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }) });
        const data = await res.json();
        if (res.ok && data.success) {
          document.getElementById('login-section').classList.add('hidden');
          if (data.role === 'admin') { document.getElementById('admin-section').classList.remove('hidden'); loadInspections(); }
          else { document.getElementById('facility-selection-section').classList.remove('hidden'); renderFacilityCards(); }
        } else alert(data.error);
      } catch { alert('خطأ في الاتصال'); } finally { btn.disabled = false; }
    }
    function logout() { location.reload(); }
    
    function renderFacilityCards() {
      const c = document.getElementById('facility-cards'); c.innerHTML = '';
      Object.keys(FACILITY_CHECKLISTS).forEach(k => { 
        const f = FACILITY_CHECKLISTS[k]; 
        c.innerHTML += `<button type="button" onclick="selectFacility('${k}')" class="bg-red-50 border-2 border-red-200 p-6 rounded-xl hover:border-red-600 transition text-center">
          <div class="text-5xl mb-3">${f.icon}</div><div class="font-bold text-lg text-red-700">${f.label}</div>
          <div class="text-xs text-gray-500 mt-1">${f.description}</div>
        </button>`; 
      });
    }
    function selectFacility(k) {
      currentFacilityKey = k; const f = FACILITY_CHECKLISTS[k]; currentChecklistState = {};
      f.categories.forEach((cat, ci) => cat.items.forEach((_, ii) => currentChecklistState[`c${ci}_i${ii}`] = {status: null, note: ''}));
      document.getElementById('facility-selection-section').classList.add('hidden'); document.getElementById('inspector-section').classList.remove('hidden');
      document.getElementById('facility_type').value = f.label; document.getElementById('facility_key').value = k; document.getElementById('facility_type_display').textContent = f.icon + ' ' + f.label;
      document.getElementById('inspect_date').value = new Date().toISOString().split('T')[0];
      renderChecklist(document.getElementById('checklist-container'), f, currentChecklistState, 'count_m', 'count_g');
    }
    function changeFacility() { document.getElementById('inspector-section').classList.add('hidden'); document.getElementById('facility-selection-section').classList.remove('hidden'); currentFacilityKey = null; }

    function buildHTML(f, state) {
      let h = '';
      f.categories.forEach((cat, ci) => {
        h += `<div class="bg-white border p-4 rounded-xl"><h4 class="font-bold text-red-700 border-b pb-2 mb-2">${ci+1}. ${cat.name}</h4><p class="text-xs text-gray-400 mb-2">المرجع: ${cat.ref}</p><div class="space-y-1">`;
        cat.items.forEach((item, ii) => {
          const key = `c${ci}_i${ii}`; const s = state[key] || {status: null, note: ''};
          const p = s.status === 'pass' ? 'bg-green-600 text-white' : 'bg-white text-green-700 border-green-300';
          const g = s.status === 'fail' ? 'bg-red-600 text-white' : 'bg-white text-red-700 border-red-300';
          h += `<div class="flex flex-col md:flex-row gap-2 p-2 border-b border-gray-100"><div class="flex-1 text-sm">${item}</div><div class="flex gap-1 shrink-0">
              <button type="button" data-key="${key}" data-status="pass" class="status-btn px-2 py-1 text-xs rounded border ${p}">مطابق</button>
              <button type="button" data-key="${key}" data-status="fail" class="status-btn px-2 py-1 text-xs rounded border ${g}">غير مطابق</button>
            </div>
            ${s.status === 'fail' ? `
              <div class="flex gap-1 w-full md:w-64">
                <input type="text" id="input-${key}" data-key="${key}" value="${s.note}" placeholder="السبب..." class="note-input w-full px-2 py-1 text-xs border rounded">
              </div>
            ` : ''}</div>`;
        });
        h += `</div></div>`;
      });
      return h;
    }

    function renderChecklist(container, f, state, idM, idG) {
      container.innerHTML = buildHTML(f, state);
      container.querySelectorAll('.status-btn').forEach(btn => { btn.onclick = () => { const k = btn.dataset.key, st = btn.dataset.status; state[k].status = state[k].status === st ? null : st; renderChecklist(container, f, state, idM, idG); updateCounts(state, idM, idG); }; });
      container.querySelectorAll('.note-input').forEach(inp => { inp.oninput = e => { state[e.target.dataset.key].note = e.target.value; }; });
      updateCounts(state, idM, idG);
    }

    function updateCounts(state, idM, idG) {
      let m = 0, g = 0; Object.values(state).forEach(s => { if (s.status === 'pass') m++; else if (s.status === 'fail') g++; });
      document.getElementById(idM).value = m; document.getElementById(idG).value = g;
      if (idM === 'edit_count_m') { document.getElementById('edit_count_m').textContent = m; document.getElementById('edit_count_g').textContent = g; }
    }

    // --- 5. MICROPHONE LOGIC (For General Notes Only) ---
    document.getElementById('general-mic-btn').onclick = function() {
      const btn = this;
      const inputField = document.getElementById('general_notes');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) { alert("متصفحك لا يدعم ميزة تحويل الصوت إلى نص. يرجى استخدام متصفح Chrome أو Safari."); return; }
      if (!navigator.onLine) { alert("تحويل الصوت إلى نص يتطلب اتصالاً بالإنترنت. يرجى كتابة الملاحظات يدوياً."); return; }

      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-LB'; 
      recognition.interimResults = false;

      btn.textContent = '🔴'; btn.classList.add('animate-pulse');
      recognition.start();

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        inputField.value = inputField.value ? inputField.value + ' - ' + text : text;
      };

      recognition.onend = () => { btn.textContent = '🎤'; btn.classList.remove('animate-pulse'); };
      recognition.onerror = () => { btn.textContent = '🎤'; btn.classList.remove('animate-pulse'); alert("حدث خطأ أثناء التسجيل، يرجى المحاولة مجدداً."); };
    };

    // --- 6. Submit & PDF ---
    async function submitInspection(e) {
      e.preventDefault(); const btn = document.getElementById('submit-btn'); btn.disabled = true; btn.textContent = 'جاري الحفظ...';
      const checklist = [];
      FACILITY_CHECKLISTS[currentFacilityKey].categories.forEach((cat, ci) => cat.items.forEach((item, ii) => {
        const s = currentChecklistState[`c${ci}_i${ii}`]; checklist.push({ category: cat.name, reference: cat.ref, item: item, status: s.status || 'pending', note: s.note || '' });
      }));
      
      const payload = {
        facility_key: currentFacilityKey, facility_type: document.getElementById('facility_type').value,
        shop_name: document.getElementById('shop_name').value, inspector: document.getElementById('inspector_name').value,
        inspect_date: document.getElementById('inspect_date').value, temp_info: document.getElementById('temp_info').value,
        count_m: document.getElementById('count_m').value, count_g: document.getElementById('count_g').value,
        result: document.getElementById('result').value, risk: document.getElementById('risk').value,
        general_notes: document.getElementById('general_notes').value,
        checklist
      };

      if (!navigator.onLine) {
        saveToLocalDB(payload);
        btn.disabled = false; btn.textContent = 'حفظ الكشف';
        return;
      }

      try {
        const res = await fetch('/api/inspections', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (res.ok && data.success) { 
          if (confirm(`✅ ${data.message}\n\nهل ترغب في طباعة/حفظ نسخة PDF للمؤسسة الآن؟`)) {
             payload.id = data.id; downloadPDF(payload);
          }
          document.getElementById('inspection-form').reset(); changeFacility(); 
        } else alert(data.error);
      } catch { saveToLocalDB(payload); } 
      finally { btn.disabled = false; btn.textContent = 'حفظ الكشف'; }
    }

    async function loadInspections() {
      const res = await fetch('/api/inspections'); windowInspections = await res.json();
      const tbody = document.getElementById('inspections-table-body'); tbody.innerHTML = '';
      windowInspections.forEach((item, idx) => {
        tbody.innerHTML += `<tr><td class="p-3">REC-2026-${item.id}</td><td class="p-3 font-bold">${item.shop_name}</td><td class="p-3">${item.inspector}</td><td class="p-3">${item.result}</td><td class="p-3"><button onclick="downloadPDF(windowInspections[${idx}])" class="bg-blue-600 text-white px-3 py-1 rounded text-xs">طباعة</button></td></tr>`;
      });
    }
    function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }

    async function downloadPDF(item) {
      if ((!item.checklist || item.checklist.length === 0) && item.id && item.id !== 'OFFLINE') {
        try { const r = await fetch(`/api/inspections/${item.id}`); if (r.ok) { const f = await r.json(); if(f.checklist) item.checklist = f.checklist; } } catch (e) {}
      }

      const list = item.checklist || []; 
      const total = list.length, p = list.filter(x=>x.status==='pass').length, f = list.filter(x=>x.status==='fail').length, n = list.filter(x=>x.status==='na').length;
      const comp = (p+f)>0 ? Math.round((p/(p+f))*100) : 0;
      
      let cHtml = '';
      const groups = {}; list.forEach(x => { if(!groups[x.category]) groups[x.category] = {ref: x.reference, items: []}; groups[x.category].items.push(x); });
      Object.entries(groups).forEach(([cat, g]) => {
        cHtml += `<div style="margin-top:15px; page-break-inside:avoid;"><div style="background:#b91c1c; color:#fff; padding:6px; font-weight:bold; font-size:14px; border-radius:4px;">${cat} — ${g.ref}</div>
          <table style="width:100%; border-collapse:collapse; margin-top:5px; font-size:13px;"><tbody>`;
        g.items.forEach(x => {
          const col = x.status==='pass'?'#16a34a':x.status==='fail'?'#dc2626':'#6b7280';
          const lbl = x.status==='pass'?'مطابق ✅':x.status==='fail'?'غير مطابق ❌':'لا ينطبق —';
          cHtml += `<tr><td style="border:1px solid #ddd; padding:6px;">${x.item}</td><td style="border:1px solid #ddd; padding:6px; text-align:center; color:${col}; font-weight:bold; width:100px;">${lbl}</td><td style="border:1px solid #ddd; padding:6px; text-align:center; color:#b45309; width:150px;">${x.note||''}</td></tr>`;
        });
        cHtml += `</tbody></table></div>`;
      });

      const generalNotesHtml = item.general_notes ? `
        <div style="margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-right: 4px solid #b91c1c; background: #f9fafb; page-break-inside: avoid;">
          <h3 style="color: #b91c1c; margin-top: 0; margin-bottom: 8px; font-size: 15px;">📝 ملاحظات وتوصيات المراقب:</h3>
          <p style="font-size: 14px; margin: 0; white-space: pre-wrap;">${item.general_notes}</p>
        </div>
      ` : '';

      const w = window.open('', '_blank');
      w.document.write(`
        <html dir="rtl"><head><meta charset="utf-8"><title>تقرير - ${item.shop_name}</title>
        <style>body{font-family:'Cairo',sans-serif; padding:30px;} .head{text-align:center; border-bottom:3px solid #b91c1c; padding-bottom:10px; margin-bottom:20px;} .head img{height:90px;} .box{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;} .box div{background:#f9fafb; padding:10px; border:1px solid #ddd; border-radius:5px;} .sum{border:2px solid #b91c1c; padding:15px; border-radius:8px; margin-bottom:20px;} .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; text-align:center; margin-bottom:15px;} .grid4 div{padding:10px; border-radius:5px;} @media print{button{display:none;}}</style>
        </head><body>
        <div class="head"><img src="${window.location.origin}/logo.png"><h2 style="color:#b91c1c;margin:10px 0 5px;">الهيئة اللبنانية لسلامة الغذاء</h2><p style="font-size:12px;color:#666;">تقرير كشف رقابي رسمي (ISO 22000 & HACCP)</p></div>
        
        <div class="box">
          <div><b>رقم الكشف:</b> ${item.id === 'OFFLINE' ? 'غير متصل (معلق)' : 'REC-2026-'+item.id}</div><div><b>نوع المؤسسة:</b> ${item.facility_type}</div>
          <div><b>المحل:</b> ${item.shop_name}</div><div><b>المراقب:</b> ${item.inspector}</div>
          <div><b>التاريخ:</b> ${item.inspect_date}</div><div><b>الحرارة:</b> ${item.temp_info||'-'}</div>
        </div>

        <div class="sum">
          <h3 style="color:#b91c1c;margin:0 0 10px;border-bottom:2px solid #b91c1c;padding-bottom:5px;">📋 ملخص التقييم النهائي</h3>
          <div class="grid4">
            <div style="background:#f3f4f6; border:1px solid #ddd;"><b>الإجمالي</b><br><span style="font-size:20px;">${total}</span></div>
            <div style="background:#f0fdf4; border:1px solid #bbf7d0;"><b>مطابق</b><br><span style="font-size:20px;color:#16a34a;">${p}</span></div>
            <div style="background:#fef2f2; border:1px solid #fecaca;"><b>غير مطابق</b><br><span style="font-size:20px;color:#dc2626;">${f}</span></div>
            <div style="background:#f3f4f6; border:1px solid #ddd;"><b>لا ينطبق</b><br><span style="font-size:20px;color:#6b7280;">${n}</span></div>
          </div>
          <div style="text-align:center; margin:10px 0; font-weight:bold;">نسبة المطابقة: <span style="color:${comp>=90?'#16a34a':'#dc2626'}; font-size:18px;">${comp}%</span></div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div style="background:#fff; border:2px solid #b91c1c; padding:10px; text-align:center; border-radius:5px;"><b>النتيجة:</b><br><span style="color:#b91c1c;font-weight:bold;">${item.result||'-'}</span></div>
            <div style="background:#fff; border:2px solid #b91c1c; padding:10px; text-align:center; border-radius:5px;"><b>الخطورة:</b><br><span style="color:#b91c1c;font-weight:bold;">${item.risk||'-'}</span></div>
          </div>
        </div>

        ${generalNotesHtml}

        <h3 style="color:#b91c1c; margin-top:25px;">قائمة التحقق التفصيلية</h3>
        ${cHtml}
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px;page-break-inside:avoid;text-align:center;">
          <div><b>توقيع المراقب</b><br><br><br><div style="border-top:2px solid #333;padding-top:5px;">${item.inspector}</div></div>
          <div><b>توقيع صاحب المؤسسة</b><br><br><br><div style="border-top:2px solid #333;padding-top:5px;">-</div></div>
        </div>
        <div style="text-align:center;margin-top:30px;"><button onclick="window.print()" style="padding:10px 30px; font-size:16px; cursor:pointer; background:#b91c1c; color:white; border:none; border-radius:5px;">🖨️ طباعة / حفظ PDF</button></div>
        <script>window.onload = () => setTimeout(() => window.print(), 800);<\/script>
        </body></html>`);
      w.document.close();
    }
  </script>
</body>
</html>
