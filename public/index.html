<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الهيئة اللبنانية لسلامة الغذاء - نظام كشف الملاحم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- شاشة تسجيل الدخول -->
  <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-200">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-red-700">الهيئة اللبنانية لسلامة الغذاء</h1>
        <p class="text-sm text-gray-500 mt-1">نظام كشف وتقييم اشتراطات الملاحم</p>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1">اسم المستخدم</label>
          <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none" placeholder="admin أو inspector1">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">كلمة المرور</label>
          <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none" placeholder="admin123 أو 1234">
        </div>
        <button type="submit" id="login-btn" class="w-full bg-red-700 text-white py-2 rounded-lg font-bold hover:bg-red-800 transition">تسجيل الدخول</button>
      </form>
    </div>
  </div>

  <!-- لوحة المراقب / استمارة الكشف -->
  <div id="inspector-section" class="hidden min-h-screen p-4 max-w-4xl mx-auto">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-200">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h2 class="text-xl font-bold text-red-700">استمارة كشف وتقييم اشتراطات الملاحم</h2>
        <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded-lg hover:bg-gray-300">تسجيل الخروج</button>
      </div>

      <form id="inspection-form" onsubmit="submitInspection(event)" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">اسم الملحمة</label>
            <input type="text" id="shop_name" required class="w-full px-4 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">اسم المراقب</label>
            <input type="text" id="inspector_name" required class="w-full px-4 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">تاريخ الكشف</label>
            <input type="date" id="inspect_date" required class="w-full px-4 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">حرارة البراد / الفريزر</label>
            <input type="text" id="temp_info" placeholder="مثال: 4°م" class="w-full px-4 py-2 border rounded-lg">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">عدد بنود المطابقة (م)</label>
            <input type="number" id="count_m" value="0" class="w-full px-4 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">عدد بنود عدم المطابقة (غير م)</label>
            <input type="number" id="count_g" value="0" class="w-full px-4 py-2 border rounded-lg">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">النتيجة النهائية</label>
            <select id="result" class="w-full px-4 py-2 border rounded-lg">
              <option value="مستوفي الشروط">مستوفي الشروط</option>
              <option value="غير مستوفي الشروط">غير مستوفي الشروط</option>
              <option value="إنذار وإتلاف">إنذار وإتلاف</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">مستوى الخطورة</label>
            <select id="risk" class="w-full px-4 py-2 border rounded-lg">
              <option value="منخفض">منخفض</option>
              <option value="متوسط">متوسط</option>
              <option value="عالي / خطر داهم">عالي / خطر داهم</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-green-700 transition">حفظ الكشف وإرساله للسحابة</button>
      </form>
    </div>
  </div>

  <!-- لوحة تحكم المدير -->
  <div id="admin-section" class="hidden min-h-screen p-4 max-w-6xl mx-auto">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-200">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h2 class="text-xl font-bold text-red-700">لوحة تحكم المدير - إحصائيات وكشوفات الملاحم</h2>
        <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded-lg hover:bg-gray-300">تسجيل الخروج</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-right border-collapse">
          <thead>
            <tr class="bg-red-700 text-white text-sm">
              <th class="p-3">رقم الكشف</th>
              <th class="p-3">الوزارة / الجهة</th>
              <th class="p-3">اسم الملحمة</th>
              <th class="p-3">المراقب</th>
              <th class="p-3">التاريخ</th>
              <th class="p-3">الحرارة</th>
              <th class="p-3">المطابق</th>
              <th class="p-3">غير المطابق</th>
              <th class="p-3">النتيجة</th>
              <th class="p-3">ملف PDF</th>
            </tr>
          </thead>
          <tbody id="inspections-table-body" class="text-sm divide-y divide-gray-200">
            <!-- يتم تعبئتها ديناميكياً -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.textContent = 'جاري التحقق...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          document.getElementById('login-section').classList.add('hidden');
          if (data.role === 'admin') {
            document.getElementById('admin-section').classList.remove('hidden');
            loadInspections();
          } else {
            document.getElementById('inspector-section').classList.remove('hidden');
            document.getElementById('inspect_date').value = new Date().toISOString().split('T')[0];
          }
        } else {
          alert(data.error || 'اسم المستخدم أو كلمة المرور غير صحيحة');
        }
      } catch (err) {
        console.error(err);
        alert('حدث خطأ في الاتصال بالخادم.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
      }
    }

    function logout() {
      location.reload();
    }

    async function submitInspection(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'جاري حفظ البيانات في السحابة...';

      try {
        const shop_name = document.getElementById('shop_name').value;
        const inspector = document.getElementById('inspector_name').value;
        const inspect_date = document.getElementById('inspect_date').value;
        const temp_info = document.getElementById('temp_info').value;
        const count_m = document.getElementById('count_m').value;
        const count_g = document.getElementById('count_g').value;
        const result = document.getElementById('result').value;
        const risk = document.getElementById('risk').value;

        const payload = {
          inspector,
          shop_name,
          inspect_date,
          temp_info,
          count_m,
          count_g,
          result,
          risk
        };

        const res = await fetch('/api/inspections', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.success) {
          alert(data.message);
          document.getElementById('inspection-form').reset();
          document.getElementById('inspect_date').value = new Date().toISOString().split('T')[0];
        } else {
          alert(data.error || 'حدث خطأ أثناء حفظ البيانات.');
        }
      } catch (err) {
        console.error(err);
        alert('حدث خطأ غير متوقع أثناء المعالجة.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'حفظ الكشف وإرساله للسحابة';
      }
    }

    async function loadInspections() {
      const res = await fetch('/api/inspections');
      const inspections = await res.json();
      const tbody = document.getElementById('inspections-table-body');
      tbody.innerHTML = '';

      inspections.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3">REC-2026-${item.id}</td>
          <td class="p-3">${item.ministry}</td>
          <td class="p-3 font-bold">${item.shop_name}</td>
          <td class="p-3">${item.inspector}</td>
          <td class="p-3">${item.inspect_date}</td>
          <td class="p-3">${item.temp_info}</td>
          <td class="p-3 text-green-600 font-bold">${item.count_m}</td>
          <td class="p-3 text-red-600 font-bold">${item.count_g}</td>
          <td class="p-3">${item.result}</td>
          <td class="p-3">
            <button onclick='downloadPDF(${JSON.stringify(item)})' class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700 transition">تحميل PDF</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function downloadPDF(item) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.text("Lebanese Food Safety Authority", 105, 20, { align: "center" });
      doc.setFontSize(11);
      doc.text("Meat Inspection & Compliance Report", 105, 28, { align: "center" });
      
      doc.line(20, 33, 190, 33);
      
      doc.setFontSize(10);
      let y = 45;
      
      const details = [
        `Inspection ID (رقم الكشف): REC-2026-${item.id}`,
        `Ministry / Entity (الجهة): ${item.ministry}`,
        `Shop Name (اسم الملحمة): ${item.shop_name}`,
        `Inspector (المراقب): ${item.inspector}`,
        `Inspection Date (التاريخ): ${item.inspect_date}`,
        `Temperature (درجة الحرارة): ${item.temp_info}`,
        `Compliant Items (بنود المطابقة M): ${item.count_m}`,
        `Non-Compliant Items (بنود عدم المطابقة G): ${item.count_g}`,
        `Final Result (النتيجة النهائية): ${item.result}`,
        `Risk Level (مستوى الخطورة): ${item.risk}`
      ];

      details.forEach(text => {
        doc.text(text, 20, y);
        y += 10;
      });

      doc.save(`Inspection_REC-2026-${item.id}.pdf`);
    }
  </script>
</body>
</html>
